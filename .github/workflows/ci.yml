name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clock-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install DT test dependencies
        run: sudo apt-get update && sudo apt-get install -y device-tree-compiler python3-yaml
      - name: Check single-source outputs and candidate-DTB rejection tests
        run: |
          python3 tools/clock_profile.py --check
          python3 tools/test_clock_profile.py
      - name: Test SCMI protocol and publication without MMIO
        run: python3 tools/test_scmi_clock.py

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build workspace
        run: nix develop -c cargo build --workspace --locked

      - name: Build minimal firmware
        run: nix develop -c cargo build -p rp1-example-minimal --release --target thumbv7m-none-eabi --locked
