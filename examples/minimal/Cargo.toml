[package]
name = "rp1-example-minimal"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
rp1-hal = { path = "../../crates/rp1-hal" }
rp1-rt = { path = "../../crates/rp1-rt" }

[build-dependencies]
rp1-build = { path = "../../crates/rp1-build" }

[features]
default = []
endpoint-clock-only = []
state3-composite-boundary = ["endpoint-clock-only"]
state5-composite-boundary = ["state3-composite-boundary"]
bar2-readonly-handshake = ["state5-composite-boundary", "debug-mailbox-layout"]
pll-sys-core-lock-only = ["bar2-readonly-handshake"]
uart0-reset-only = ["pll-sys-core-lock-only"]
uart0-functional-clock-before-reset-done = ["uart0-reset-only"]
uart0-tx-polling-only = ["uart0-functional-clock-before-reset-done"]
uart0-polled-rx = ["uart0-tx-polling-only"]
uart0-rx-irq = ["uart0-polled-rx", "rp1-rt/uart0-rx-irq"]
pwm-gpio12-proof = ["pll-sys-core-lock-only"]
pcie-ep-init = ["rp1-hal/pcie-ep-init", "rp1-rt/pcie-ep-init"]
debug-stack-low = ["rp1-hal/debug-stack-low", "rp1-rt/debug-stack-low"]
debug-snapshot = ["debug-stack-low", "rp1-hal/debug-snapshot", "rp1-rt/debug-snapshot"]
debug-mailbox-layout = [
    "debug-stack-low",
    "rp1-hal/debug-mailbox-layout",
    "rp1-rt/debug-mailbox-layout",
]
debug-mailbox-init = [
    "debug-mailbox-layout",
    "rp1-hal/debug-mailbox-init",
    "rp1-rt/debug-mailbox-init",
]
debug-mailbox-ping = ["state5-composite-boundary", "debug-mailbox-init"]
gpio-wiring-proof = ["state5-composite-boundary"]
i2c1-reset-only = ["pll-sys-core-lock-only"]
i2c1-host-proof = ["i2c1-reset-only"]
debug-stub = [
    "pcie-ep-init",
    "debug-snapshot",
    "debug-mailbox-init",
    "rp1-hal/debug-stub",
    "rp1-rt/debug-stub",
]
