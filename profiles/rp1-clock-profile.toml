# Candidate policy, NOT a measurement of the currently running hardware.
# Never program a PLL from this file. Admission also requires physical readback.
schema = 1
name = "proc0-linux-standard-v1"
mailbox_channel = 1
firmware_pins = [2, 3, 8, 9, 10, 11, 14, 15]
firmware_nodes = ["serial@30000", "spi@50000", "i2c@74000"]

[linux]
disable_labels = ["rp1_clocks", "rp1_uart0", "rp1_spi0", "rp1_i2c1", "rp1_firmware"]
uart1_label = "rp1_uart1"
uart1_pins_label = "rp1_uart1_0_1"
uart1_clock = "uart"
cfe_labels = ["rp1_csi0", "rp1_csi1"]
cfe_clocks = ["mipi0_cfg", "mipi1_cfg"]

[[clock]]
name = "uart"
rp1_id = 15
binding = "RP1_CLK_UART"
mode = "fixed"
rate_hz = 50000000
boot_required = true
rp1_required = true

[[clock]]
name = "mipi0_cfg"
rp1_id = 22
binding = "RP1_CLK_MIPI0_CFG"
mode = "fixed"
rate_hz = 25000000
boot_required = true
rp1_required = false

[[clock]]
name = "mipi1_cfg"
rp1_id = 23
binding = "RP1_CLK_MIPI1_CFG"
mode = "fixed"
rate_hz = 25000000
boot_required = true
rp1_required = false

# Discovery/policy bring-up object; UART1's first (functional) clock is FIXED.
# This is the existing 100 MHz APB contract, not permission to retune PLL_SYS.
[[clock]]
name = "uart_apb"
rp1_id = 6
binding = "RP1_PLL_SYS_PRI_PH"
mode = "scmi"
scmi_id = 0
rate_hz = 100000000
allowed_rates = [100000000]
boot_required = true
rp1_required = true

# Other binding IDs remain UNCLASSIFIED, not silently FIRMWARE_PRIVATE.
# The validator refuses any enabled consumer still referencing clk-rp1.
