[package]
name = "rp1-freertos"
version = "0.1.0"
edition = "2024"
links = "rp1_freertos"
build = "build.rs"

[dependencies]
rp1-hal = { path = "../rp1-hal", optional = true }

[features]
task-pool-2304 = []
sync-pool-r1 = []
newlib-memcpy = []
assert-probe = []
critical-timing = []
spi0-irq = ["dep:rp1-hal"]
spi0-cancel-window-probe = ["spi0-irq"]
i2c1-irq = ["dep:rp1-hal"]
i2c1-cancel-window-probe = ["i2c1-irq"]
uart0-irq = ["dep:rp1-hal"]
