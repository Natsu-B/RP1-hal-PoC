[package]
name = "rp1-hal"
version = "0.1.0"
edition = "2024"

[features]
default = []
pcie-ep-init = ["rp1-rt/pcie-ep-init"]
debug-stack-low = ["rp1-rt/debug-stack-low"]
debug-snapshot = ["debug-stack-low", "rp1-rt/debug-snapshot"]
debug-mailbox-layout = ["debug-stack-low", "rp1-rt/debug-mailbox-layout"]
debug-mailbox-layout-v1 = ["debug-mailbox-layout", "rp1-rt/debug-mailbox-layout-v1"]
debug-mailbox-layout-v2 = ["debug-mailbox-layout", "rp1-rt/debug-mailbox-layout-v2"]
bar2-rpc-v2 = ["debug-mailbox-layout-v2"]
scmi-uart-clock = ["debug-mailbox-layout-v2", "rp1-rt/scmi-uart-clock"]
debug-mailbox-init = ["debug-mailbox-layout", "rp1-rt/debug-mailbox-init"]
debug-stub = ["pcie-ep-init", "debug-snapshot", "debug-mailbox-init", "rp1-rt/debug-stub"]

[dependencies]
rp1-abi = { path = "../rp1-abi" }
rp1-macros = { path = "../rp1-macros" }
rp1-rt = { path = "../rp1-rt", optional = true }
