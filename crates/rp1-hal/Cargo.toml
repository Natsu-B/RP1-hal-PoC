[package]
name = "rp1-hal"
version = "0.1.0"
edition = "2024"

[features]
default = []
virtio-probe = []
openamp = ["rp1-rt/openamp-holdboot"]
openamp-rpmsg = ["openamp"]
amp-bulk = ["openamp-rpmsg"]
amp-proc1-probe = ["amp-bulk"]
amp-observation = ["amp-proc1-probe", "rp1-abi/amp-observation"]
scmi-clock = ["rp1-rt/scmi-shmem"]
pcie-ep-init = ["rp1-rt/pcie-ep-init"]
debug-stack-low = ["rp1-rt/debug-stack-low"]
debug-snapshot = ["debug-stack-low", "rp1-rt/debug-snapshot"]
debug-mailbox-layout = ["debug-stack-low", "rp1-rt/debug-mailbox-layout"]
debug-mailbox-layout-v1 = ["debug-mailbox-layout", "rp1-rt/debug-mailbox-layout-v1"]
debug-mailbox-init = ["debug-mailbox-layout", "rp1-rt/debug-mailbox-init"]
debug-stub = ["pcie-ep-init", "debug-snapshot", "debug-mailbox-init", "rp1-rt/debug-stub"]

gpio-irq-codegen-probe = []

[dependencies]
embedded-hal = "=1.0.0"
rp1-abi = { path = "../rp1-abi" }
rp1-macros = { path = "../rp1-macros" }
rp1-rt = { path = "../rp1-rt", optional = true }

[[example]]
name = "local-control-codegen-probe"
path = "../../tools/local-control-codegen-probe.rs"
crate-type = ["lib"]

[[example]]
name = "gpio-irq-codegen-probe"
path = "../../tools/gpio-irq-codegen-probe.rs"
crate-type = ["lib"]
required-features = ["gpio-irq-codegen-probe"]
